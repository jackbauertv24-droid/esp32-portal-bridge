name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  IDF_IMAGE: espressif/idf:v5.5.6

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for the pure-C parts
        run: |
          set -e
          FLAGS="-Wall -Wextra -Werror -std=c11 -g -fsanitize=address,undefined -I firmware/core"
          gcc $FLAGS tests/test_sms_pdu.c firmware/core/sms_pdu.c -o t_pdu && ./t_pdu
          gcc $FLAGS tests/test_core.c firmware/core/textutil.c firmware/core/urlutil.c firmware/core/html_form.c -o t_core && ./t_core
          gcc $FLAGS tests/test_submit.c firmware/core/sms_pdu.c -o t_submit
          gcc $FLAGS tests/test_netparse.c firmware/core/netparse.c -o t_netparse && ./t_netparse
          npm install --no-save --silent node-pdu@2.1.2
          ./t_submit | node tests/verify_submit.mjs

  firmware:
    runs-on: ubuntu-24.04
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp build identity
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="$GITHUB_REF_NAME"; else VERSION="$(git describe --tags --always)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cat > firmware/main/build_info.h <<EOF
          #pragma once
          #define FW_VERSION "${VERSION}"
          #define FW_COMMIT "${GITHUB_SHA::7}"
          #define FW_BUILT "$(date -u +%Y-%m-%dT%H:%MZ)"
          EOF
          cat firmware/main/build_info.h

      - name: Build with ESP-IDF (${{ env.IDF_IMAGE }})
        run: |
          docker run --rm -v "$PWD:/project" -w /project/firmware "$IDF_IMAGE" bash -c '
            set -e
            git config --global --add safe.directory "*"
            idf.py set-target esp32s3
            idf.py build
            if xtensa-esp32s3-elf-nm build/esp-idf/lwip/liblwip.a 2>/dev/null | grep -q " U pb_route_hook"; then echo "lwIP route hook: installed"; else echo "ERROR: lwIP does not call pb_route_hook (load balancer would be inert)"; exit 1; fi
            if xtensa-esp32s3-elf-nm build/esp-idf/lwip/liblwip.a 2>/dev/null | grep -q " U pb_input_hook"; then echo "lwIP input hook: installed"; else echo "ERROR: lwIP does not call pb_input_hook (data meter would read zero)"; exit 1; fi
            cd build
            esptool.py --chip esp32s3 merge_bin -o merged.bin @flash_args
            ls -la *.bin
            idf.py -C .. size | tail -n 20 || true
          '

      - name: Package
        run: |
          mkdir dist
          cp firmware/build/merged.bin "dist/portal-bridge-${VERSION}-full.bin"
          cp firmware/build/portal_bridge.bin "dist/portal-bridge-${VERSION}-ota.bin"
          (cd dist && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: portal-bridge-${{ env.VERSION }}
          path: dist/

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Build \`${GITHUB_SHA::7}\` of ${VERSION}. Full guide: README.

          **First install (USB cable):** flash \`portal-bridge-${VERSION}-full.bin\` at address **0x0**
          with https://espressif.github.io/esptool-js/ in Chrome or Edge.

          **Update a running board (no cable):** admin page → Tools → Firmware update →
          \`portal-bridge-${VERSION}-ota.bin\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
