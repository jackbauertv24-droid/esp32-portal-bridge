name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ESP32_CORE: "3.3.12"
  FQBN: "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=custom,FlashMode=qio,CDCOnBoot=default,USBMode=hwcdc"

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for the pure-C parts (SMS PDU decoder)
        run: |
          gcc -Wall -Wextra -Werror -std=c11 -fsanitize=address,undefined -I firmware/portal_bridge \
            tests/test_sms_pdu.c firmware/portal_bridge/sms_pdu.c -o test_sms_pdu
          ./test_sms_pdu

  firmware:
    runs-on: ubuntu-24.04
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache ESP32 core
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
          key: esp32-core-${{ env.ESP32_CORE }}

      - name: Install ESP32 core ${{ env.ESP32_CORE }}
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}

      - name: Stamp build identity
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="$GITHUB_REF_NAME"; else VERSION="$(git describe --tags --always)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cat > firmware/portal_bridge/build_info.h <<EOF
          #pragma once
          #define FW_NAME "portal-bridge"
          #define FW_VERSION "${VERSION}"
          #define FW_COMMIT "${GITHUB_SHA::7}"
          #define FW_BUILT "$(date -u +%Y-%m-%dT%H:%MZ)"
          EOF
          cat firmware/portal_bridge/build_info.h

      - name: Compile
        run: |
          arduino-cli compile --fqbn "$FQBN" --warnings default --export-binaries \
            --output-dir out firmware/portal_bridge
          ls -la out

      - name: Package
        run: |
          mkdir dist
          cp out/portal_bridge.ino.merged.bin "dist/portal-bridge-${VERSION}-full.bin"
          cp out/portal_bridge.ino.bin "dist/portal-bridge-${VERSION}-ota.bin"
          (cd dist && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: portal-bridge-${{ env.VERSION }}
          path: dist/

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Build \`${GITHUB_SHA::7}\` of ${VERSION}. See the README for the full guide.

          **First install or recovery (USB cable):** flash \`portal-bridge-${VERSION}-full.bin\` at address **0x0**
          with https://espressif.github.io/esptool-js/ in Chrome or Edge.

          **Update an already-running board (no cable):** open the admin page → Firmware, and upload
          \`portal-bridge-${VERSION}-ota.bin\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
